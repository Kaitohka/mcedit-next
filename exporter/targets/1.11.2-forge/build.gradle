// Unimined, by wagyourtail, builds mods for old versions of Forge with today's Gradle. Forge for 1.8.9 to 1.11.2
// runs mods with Searge's names for the game, which the jar is remapped to from MCP's.
plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

ext.minecraftVersion = '1.11.2'
ext.loader = 'forge'
ext.javaRelease = 8
apply from: '../shared.gradle'

base.archivesName = 'mcedit_exporter-1.11.2-forge'

repositories {
    mavenCentral()
}

unimined.minecraft {
    version '1.11.2'
    mappings {
        searge()
        mcp('stable', '32-1.11')
    }
    minecraftForge {
        loader '13.20.1.2588'
    }
}
