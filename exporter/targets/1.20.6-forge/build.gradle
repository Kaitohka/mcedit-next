// Forge from 1.20.6 runs with Mojang's names for the game, so the jar is used as it is compiled, with no remapping.
// ForgeGradle needs a Gradle of its own: this target has its own wrapper, for Gradle 8.8.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

ext.minecraftVersion = '1.20.6'
ext.loader = 'forge'
ext.javaRelease = 21
apply from: '../shared.gradle'

base.archivesName = 'mcedit_exporter-1.20.6-forge'

minecraft {
    mappings channel: 'official', version: '1.20.6'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.6-50.2.15'
}
