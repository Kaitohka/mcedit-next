// Forge from 1.20.2 to 1.20.4 runs with SRG names for the game, which ModDevGradle's legacyforge plugin does not
// map to: ForgeGradle does, and needs a Gradle of its own, so this target has its own wrapper, for Gradle 8.8.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

ext.minecraftVersion = '1.20.4'
ext.loader = 'forge'
ext.javaRelease = 17
apply from: '../shared.gradle'

base.archivesName = 'mcedit_exporter-1.20.4-forge'

minecraft {
    mappings channel: 'official', version: '1.20.4'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.4-49.2.13'
}

// The jar build_universal.py takes is the one with Forge's names for the game, as it has them at run time.
jar.finalizedBy('reobfJar')
