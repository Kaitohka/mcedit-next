// ForgeGradle is the only build tool for Forge 1.16.5, and needs a Gradle of its own: this target has its own
// wrapper, for Gradle 8.8.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

ext.minecraftVersion = '1.16.5'
ext.loader = 'forge'
ext.javaRelease = 8
// Forge for 1.16.5 has MCP's names for the game's classes.
ext.versionFolder = '1.16.5-forge'
apply from: '../shared.gradle'

base.archivesName = 'mcedit_exporter-1.16.5-forge'

minecraft {
    mappings channel: 'official', version: '1.16.5'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
}

// The jar build_universal.py takes is the one with Forge's names for the game, as it has them at run time.
jar.finalizedBy('reobfJar')
