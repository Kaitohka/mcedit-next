# Forge from 1.13.2 on, and NeoForge from 1.20.1 to 1.20.4. NeoForge from 1.20.5 reads neoforge.mods.toml instead.
# The javafml versions are Forge's own, 25 for 1.13.2 and up, and NeoForge's from 1.20.2, which began again at 1.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "BSD-3-Clause"

[[mods]]
modId = "mcedit_exporter"
version = "@VERSION@"
displayName = "MCEdit Exporter"
description = '''
Exports the blocks and block entities registered in this client, so that MCEdit can display them.
Runs on the client only and does nothing until /mcedit_export is used.
'''

[[dependencies.mcedit_exporter]]
modId = "minecraft"
mandatory = true
versionRange = "@FORGE_VERSIONS@"
ordering = "NONE"
side = "CLIENT"
